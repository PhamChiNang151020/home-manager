name: Daily reminder push

on:
  schedule:
    # 08:00 Asia/Ho_Chi_Minh = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke send-reminder-push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Missing SUPABASE_URL, SUPABASE_ANON_KEY, or CRON_SECRET"
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          HTTP_CODE=$(curl -sS -o /tmp/push-body.txt -w "%{http_code}" \
            -X POST "${BASE}/functions/v1/send-reminder-push" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/push-body.txt
          echo
          case "${HTTP_CODE}" in
            2??) ;;
            *) exit 1 ;;
          esac
