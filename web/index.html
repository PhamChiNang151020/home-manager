<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Tổ Ấm — Giữ ấm tổ ấm, giữ vững chi tiêu">
  <meta name="theme-color" content="#0B0D10">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tổ Ấm">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tổ Ấm</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // iOS standalone PWA: sync viewport vars before first paint so touch bounds
    // match painted layout. WebKit cold-start can report innerHeight ~59px
    // shorter than screen.height while still painting edge-to-edge.
    (function () {
      function isStandalone() {
        if (navigator.standalone) return true;
        return window.matchMedia &&
          (window.matchMedia("(display-mode: standalone)").matches ||
            window.matchMedia("(display-mode: fullscreen)").matches ||
            window.matchMedia("(display-mode: minimal-ui)").matches);
      }

      function syncStandaloneViewport() {
        var innerHeight = window.innerHeight || 0;
        var screenMax = Math.max(screen.width || 0, screen.height || 0);
        var gap =
          screenMax > innerHeight && innerHeight > 0
            ? screenMax - innerHeight
            : 0;

        document.documentElement.style.setProperty(
          "--standalone-bottom-gap",
          gap + "px",
        );

        if (!isStandalone() && gap <= 0) return;

        document.documentElement.style.setProperty(
          "--app-height",
          innerHeight + "px",
        );
        document.documentElement.style.height = innerHeight + "px";
        document.body.style.height = innerHeight + "px";
      }

      syncStandaloneViewport();
      window.addEventListener("resize", syncStandaloneViewport);
      window.addEventListener("orientationchange", syncStandaloneViewport);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncStandaloneViewport);
      }
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: #0B0D10;
      overflow: hidden;
      overscroll-behavior: none;
    }
    @supports (height: 100dvh) {
      html, body {
        height: 100dvh;
      }
    }
    @media (display-mode: standalone) {
      html, body {
        height: var(--app-height, 100%);
        min-height: var(--app-height, 100%);
        max-height: var(--app-height, 100%);
        overflow: hidden;
      }
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0B0D10;
      transition: opacity 200ms ease-out;
    }
    #splash.removing {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }
    .splash-name {
      margin: 16px 0 0;
      color: #E8EDF5;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 600;
    }
    .splash-tagline {
      margin: 6px 16px 0;
      color: #94A3B8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      text-align: center;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Tổ Ấm" width="96" height="96" />
    <p class="splash-name">Tổ Ấm</p>
    <p class="splash-tagline">Giữ ấm tổ ấm, giữ vững chi tiêu</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeSplash() {
      const el = document.getElementById('splash');
      if (!el || el.classList.contains('removing')) return;
      el.classList.add('removing');
      setTimeout(() => el.remove(), 220);
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    setTimeout(removeSplash, 8000);

    (function installPwaHistoryGuard() {
      if (window.__pwaHistoryGuardInstalled) return;
      window.__pwaHistoryGuardInstalled = true;
      window.addEventListener('popstate', function () {
        history.pushState(null, '', location.href);
      });
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) location.reload();
      });
    })();

    window.resetPwaBrowserHistory = function () {
      history.replaceState(null, '', location.href);
      history.pushState(null, '', location.href);
    };

    // Auto-reload for iOS Simulator Safari when served via local IP (dev only)
    if (/^192\.168\.|^10\.|^172\.(1[6-9]|2\d|3[01])\./.test(location.hostname)) {
      let lastEtag = null;
      setInterval(async () => {
        try {
          const res = await fetch('/flutter_bootstrap.js', { cache: 'no-store' });
          const etag = res.headers.get('etag') || res.headers.get('last-modified');
          if (lastEtag && etag !== lastEtag) location.reload();
          lastEtag = etag;
        } catch (_) {}
      }, 2000);
    }
  </script>
</body>
</html>
