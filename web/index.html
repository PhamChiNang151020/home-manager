<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Tổ Ấm — Giữ ấm tổ ấm, giữ vững chi tiêu">
  <meta name="theme-color" content="#0B0D10">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tổ Ấm">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tổ Ấm</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // iOS: Flutter web reads document.documentElement.clientHeight, which can
    // exceed the touch-interactive box (innerHeight / visualViewport). Override
    // before the engine loads and keep flutter host elements in sync.
    (function () {
      function isIos() {
        return /iPhone|iPad|iPod/i.test(navigator.userAgent);
      }
      if (!isIos()) return;

      function isHomeScreenShell() {
        if (navigator.standalone) return true;
        try {
          if (window.matchMedia("(display-mode: standalone)").matches) return true;
          if (window.matchMedia("(display-mode: fullscreen)").matches) return true;
        } catch (_) {}
        // Web Clip / profile shortcut: no Safari chrome between outer/inner height.
        return Math.abs(window.outerHeight - window.innerHeight) <= 2;
      }

      function interactiveHeight() {
        if (isHomeScreenShell()) return window.innerHeight;
        var vv = window.visualViewport;
        return vv && vv.height > 0 ? vv.height : window.innerHeight;
      }

      function interactiveWidth() {
        var vv = window.visualViewport;
        return vv && vv.width > 0 ? vv.width : window.innerWidth;
      }

      try {
        Object.defineProperty(document.documentElement, "clientHeight", {
          get: function () {
            return Math.round(interactiveHeight());
          },
          configurable: true,
        });
        Object.defineProperty(document.documentElement, "clientWidth", {
          get: function () {
            return Math.round(interactiveWidth());
          },
          configurable: true,
        });
      } catch (_) {}

      function flutterHosts() {
        return document.querySelectorAll(
          "flutter-view, flt-glass-pane, flt-scene-host"
        );
      }

      function clearHomeScreenShell() {
        document.documentElement.style.height = "";
        document.body.style.height = "";
        document.documentElement.style.removeProperty("--app-height");
        document.documentElement.removeAttribute("data-ios-home-screen");
        flutterHosts().forEach(function (el) {
          el.style.height = "";
          el.style.maxHeight = "";
        });
      }

      function syncHomeScreenShell() {
        if (!isHomeScreenShell()) {
          clearHomeScreenShell();
          return;
        }
        var h = window.innerHeight;
        if (!h) return;
        document.documentElement.style.setProperty("--app-height", h + "px");
        document.documentElement.style.height = h + "px";
        document.body.style.height = h + "px";
        document.documentElement.setAttribute("data-ios-home-screen", "true");
        flutterHosts().forEach(function (el) {
          el.style.width = "100%";
          el.style.height = h + "px";
          el.style.maxHeight = h + "px";
        });
      }

      var timer;
      function scheduleSync() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          syncHomeScreenShell();
          window.dispatchEvent(new Event("resize"));
        }, 50);
      }

      syncHomeScreenShell();
      window.addEventListener("resize", scheduleSync);
      window.addEventListener("orientationchange", scheduleSync);
      window.addEventListener("flutter-first-frame", function () {
        syncHomeScreenShell();
        window.dispatchEvent(new Event("resize"));
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleSync);
        window.visualViewport.addEventListener("scroll", scheduleSync);
      }
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: #0B0D10;
      overflow: hidden;
      overscroll-behavior: none;
    }
    html[data-ios-home-screen="true"],
    html[data-ios-home-screen="true"] body {
      height: var(--app-height, 100%);
      min-height: var(--app-height, 100%);
      max-height: var(--app-height, 100%);
    }
    html[data-ios-home-screen="true"] flutter-view,
    html[data-ios-home-screen="true"] flt-glass-pane,
    html[data-ios-home-screen="true"] flt-scene-host {
      height: var(--app-height, 100%) !important;
      max-height: var(--app-height, 100%) !important;
      width: 100% !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0B0D10;
      transition: opacity 200ms ease-out;
    }
    #splash.removing {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }
    .splash-name {
      margin: 16px 0 0;
      color: #E8EDF5;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 600;
    }
    .splash-tagline {
      margin: 6px 16px 0;
      color: #94A3B8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      text-align: center;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Tổ Ấm" width="96" height="96" />
    <p class="splash-name">Tổ Ấm</p>
    <p class="splash-tagline">Giữ ấm tổ ấm, giữ vững chi tiêu</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeSplash() {
      const el = document.getElementById('splash');
      if (!el || el.classList.contains('removing')) return;
      el.classList.add('removing');
      setTimeout(() => el.remove(), 220);
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    setTimeout(removeSplash, 8000);

    (function installPwaHistoryGuard() {
      if (window.__pwaHistoryGuardInstalled) return;
      window.__pwaHistoryGuardInstalled = true;
      window.addEventListener('popstate', function () {
        history.pushState(null, '', location.href);
      });
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) location.reload();
      });
    })();

    window.resetPwaBrowserHistory = function () {
      history.replaceState(null, '', location.href);
      history.pushState(null, '', location.href);
    };

    // Auto-reload for iOS Simulator Safari when served via local IP (dev only)
    if (/^192\.168\.|^10\.|^172\.(1[6-9]|2\d|3[01])\./.test(location.hostname)) {
      let lastEtag = null;
      setInterval(async () => {
        try {
          const res = await fetch('/flutter_bootstrap.js', { cache: 'no-store' });
          const etag = res.headers.get('etag') || res.headers.get('last-modified');
          if (lastEtag && etag !== lastEtag) location.reload();
          lastEtag = etag;
        } catch (_) {}
      }, 2000);
    }
  </script>
</body>
</html>
