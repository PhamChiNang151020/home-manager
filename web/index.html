<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Tổ Ấm — Giữ ấm tổ ấm, giữ vững chi tiêu">
  <meta name="theme-color" content="#0B0D10">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tổ Ấm">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tổ Ấm</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    // iOS home-screen: paint + hit-test must share one box. Flutter is embedded
    // in #flutter-host (see flutter_bootstrap.js). Size that host to the
    // interactive viewport; do not reposition flutter-view after Flutter owns it.
    (function () {
      function isIos() {
        return /iPhone|iPad|iPod/i.test(navigator.userAgent);
      }

      function isHomeScreenShell() {
        if (!isIos()) return false;
        if (navigator.standalone) return true;
        try {
          if (window.matchMedia("(display-mode: standalone)").matches) return true;
          if (window.matchMedia("(display-mode: fullscreen)").matches) return true;
        } catch (_) {}
        // Web Clip / profile icon: little or no Safari chrome.
        return Math.abs(window.outerHeight - window.innerHeight) <= 50;
      }

      function interactiveSize() {
        var vv = window.visualViewport;
        var height =
          vv && vv.height > 0 ? vv.height : window.innerHeight || 0;
        var width =
          vv && vv.width > 0 ? vv.width : window.innerWidth || 0;
        var top = vv ? vv.offsetTop || 0 : 0;
        return {
          height: Math.max(0, Math.round(height)),
          width: Math.max(0, Math.round(width)),
          top: Math.max(0, Math.round(top)),
        };
      }

      function defineClientMetrics() {
        if (!isIos()) return;
        try {
          Object.defineProperty(document.documentElement, "clientHeight", {
            get: function () {
              return interactiveSize().height;
            },
            configurable: true,
          });
          Object.defineProperty(document.documentElement, "clientWidth", {
            get: function () {
              return interactiveSize().width;
            },
            configurable: true,
          });
        } catch (_) {}
      }
      defineClientMetrics();

      function syncFlutterHost() {
        var host = document.getElementById("flutter-host");
        if (!host) return;

        var size = interactiveSize();
        if (!size.height) return;

        document.documentElement.style.setProperty(
          "--app-height",
          size.height + "px"
        );
        document.documentElement.style.setProperty(
          "--app-width",
          size.width + "px"
        );
        document.documentElement.style.setProperty(
          "--app-offset-top",
          size.top + "px"
        );

        if (isHomeScreenShell()) {
          document.documentElement.setAttribute("data-ios-home-screen", "true");
        } else {
          document.documentElement.removeAttribute("data-ios-home-screen");
        }

        host.style.top = size.top + "px";
        host.style.height = size.height + "px";
        host.style.width = size.width + "px";
        host.style.maxHeight = size.height + "px";
      }

      var timer;
      function scheduleSync() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          syncFlutterHost();
          window.dispatchEvent(new Event("resize"));
        }, 50);
      }

      syncFlutterHost();
      window.addEventListener("resize", scheduleSync);
      window.addEventListener("orientationchange", scheduleSync);
      window.addEventListener("flutter-first-frame", scheduleSync);
      window.addEventListener("pageshow", scheduleSync);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleSync);
        window.visualViewport.addEventListener("scroll", scheduleSync);
      }
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: #0B0D10;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    #flutter-host {
      position: fixed;
      top: var(--app-offset-top, 0);
      left: 0;
      width: var(--app-width, 100%);
      height: var(--app-height, 100%);
      max-height: var(--app-height, 100%);
      overflow: hidden;
      background-color: #0B0D10;
    }
    #flutter-host > flutter-view,
    #flutter-host > flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0B0D10;
      transition: opacity 200ms ease-out;
    }
    #splash.removing {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }
    .splash-name {
      margin: 16px 0 0;
      color: #E8EDF5;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 600;
    }
    .splash-tagline {
      margin: 6px 16px 0;
      color: #94A3B8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      text-align: center;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Tổ Ấm" width="96" height="96" />
    <p class="splash-name">Tổ Ấm</p>
    <p class="splash-tagline">Giữ ấm tổ ấm, giữ vững chi tiêu</p>
  </div>
  <div id="flutter-host"></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeSplash() {
      const el = document.getElementById('splash');
      if (!el || el.classList.contains('removing')) return;
      el.classList.add('removing');
      setTimeout(() => el.remove(), 220);
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    setTimeout(removeSplash, 8000);

    (function installPwaHistoryGuard() {
      if (window.__pwaHistoryGuardInstalled) return;
      window.__pwaHistoryGuardInstalled = true;

      // Flutter Web stores serial metadata on history.state. Never replace with
      // null — that triggers "unexpected null history state" on hot restart.
      function flutterSafeHistoryState() {
        var state = history.state;
        return state !== null && typeof state === "object" ? state : {};
      }

      function isStandaloneShell() {
        if (navigator.standalone) return true;
        try {
          if (window.matchMedia("(display-mode: standalone)").matches) return true;
          if (window.matchMedia("(display-mode: fullscreen)").matches) return true;
        } catch (_) {}
        return false;
      }

      window.addEventListener("popstate", function () {
        if (!isStandaloneShell()) return;
        history.pushState(flutterSafeHistoryState(), "", location.href);
      });
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) location.reload();
      });

      window.resetPwaBrowserHistory = function () {
        // Only trap back on installed PWA / home-screen; skip browser debug.
        if (!isStandaloneShell()) return;
        var state = flutterSafeHistoryState();
        history.replaceState(state, "", location.href);
        history.pushState(state, "", location.href);
      };
    })();

    // Auto-reload for iOS Simulator Safari when served via local IP (dev only)
    if (/^192\.168\.|^10\.|^172\.(1[6-9]|2\d|3[01])\./.test(location.hostname)) {
      let lastEtag = null;
      setInterval(async () => {
        try {
          const res = await fetch('/flutter_bootstrap.js', { cache: 'no-store' });
          const etag = res.headers.get('etag') || res.headers.get('last-modified');
          if (lastEtag && etag !== lastEtag) location.reload();
          lastEtag = etag;
        } catch (_) {}
      }, 2000);
    }
  </script>
</body>
</html>
