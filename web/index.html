<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Personal home management app">
  <meta name="theme-color" content="#0B0D10">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Home">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My Home</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      background-color: #0B0D10;
      overscroll-behavior-x: none;
    }
    @supports (padding: env(safe-area-inset-top)) {
      body {
        min-height: calc(100% + env(safe-area-inset-top));
      }
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0B0D10;
      transition: opacity 200ms ease-out;
    }
    #splash.removing {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .splash-tagline {
      margin: 16px 0 0;
      color: #94A3B8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="My Home" width="64" height="64" />
    <p class="splash-tagline">My Home</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeSplash() {
      const el = document.getElementById('splash');
      if (!el || el.classList.contains('removing')) return;
      el.classList.add('removing');
      setTimeout(() => el.remove(), 220);
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    setTimeout(removeSplash, 8000);

    // Block iOS Safari edge-swipe back navigation in PWA
    history.pushState({ guard: true }, '', location.href);
    window.addEventListener('popstate', () => {
      history.pushState({ guard: true }, '', location.href);
    });

    // Auto-reload for iOS Simulator Safari when served via local IP (dev only)
    if (/^192\.168\.|^10\.|^172\.(1[6-9]|2\d|3[01])\./.test(location.hostname)) {
      let lastEtag = null;
      setInterval(async () => {
        try {
          const res = await fetch('/flutter_bootstrap.js', { cache: 'no-store' });
          const etag = res.headers.get('etag') || res.headers.get('last-modified');
          if (lastEtag && etag !== lastEtag) location.reload();
          lastEtag = etag;
        } catch (_) {}
      }, 2000);
    }
  </script>
</body>
</html>
